<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/index.css">
    <script src="js/db.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/index.js"></script>
    <style>
        .auth-card { max-width: 400px; margin: 2rem auto; padding: 0 1rem; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-form .field { margin-bottom: 1rem; }
        .auth-form label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #111827; }
        .auth-form input[type="email"], .auth-form input[type="password"], .auth-form input[type="text"] { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .auth-form input.error { border-color: #dc2626; }
        .auth-form button[type="submit"] { width: 100%; padding: 0.6rem; border: 1px solid #1f2937; border-radius: 4px; background: #1f2937; color: #fff; cursor: pointer; font-size: 1rem; }
        .auth-form button[type="submit"]:hover { background: #374151; }
        .auth-form .error-msg { display: none; margin-top: 0.75rem; padding: 0.6rem; border: 1px solid #dc2626; border-radius: 4px; background: #fef2f2; color: #dc2626; font-size: 0.95rem; }
        .auth-links { margin-top: 1rem; text-align: center; font-size: 0.95rem; }
        .auth-links a { color: #2563eb; text-decoration: none; cursor: pointer; }
        .auth-links a:hover { text-decoration: underline; }
        .auth-links a.hidden { display: none; }
    </style>
</head>
<body>
    <gm-header></gm-header>

    <main>
        <h1 id="auth-title">Login</h1>
        <p id="auth-subtitle">Welcome back. Please sign in to your account.</p>

        <div class="auth-card">
            <form class="auth-form login-form active" id="login" novalidate>
                <div class="field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••">
                </div>
                <button type="submit">Sign in</button>
                <div id="login-error" class="error-msg">Email and password are required to sign in.</div>
            </form>

            <form class="auth-form" id="register" novalidate>
                <div class="field">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name" name="name" placeholder="John Doe">
                </div>
                <div class="field">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" placeholder="••••••••">
                </div>
                <div class="field">
                    <label for="register-confirm">Confirm Password</label>
                    <input type="password" id="register-confirm" name="confirm" placeholder="••••••••">
                </div>
                <button type="submit">Create account</button>
                <div id="register-error" class="error-msg">All fields are required to create an account.</div>
            </form>

            <div class="auth-links">
                <a id="link-register" href="#">Don't have an account? Register</a>
                <a id="link-login" href="#" class="hidden">Already have an account? Login</a>
            </div>
        </div>
    </main>

    <gm-footer></gm-footer>

    <script>
        const loginForm = document.getElementById('login');
        const registerForm = document.getElementById('register');
        const linkRegister = document.getElementById('link-register');
        const linkLogin = document.getElementById('link-login');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');

        function showLogin() {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            linkRegister.classList.remove('hidden');
            linkLogin.classList.add('hidden');
            authTitle.textContent = 'Login';
            authSubtitle.textContent = 'Welcome back. Please sign in to your account.';
            clearErrors(loginForm);
        }

        function showRegister() {
            loginForm.classList.remove('active');
            registerForm.classList.add('active');
            linkRegister.classList.add('hidden');
            linkLogin.classList.remove('hidden');
            authTitle.textContent = 'Register';
            authSubtitle.textContent = 'Create your account to get started.';
            clearErrors(registerForm);
        }

        function clearErrors(form) {
            form.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none');
            form.querySelectorAll('input.error').forEach(i => i.classList.remove('error'));
        }

        linkRegister.addEventListener('click', function (e) {
            e.preventDefault();
            showRegister();
        });

        linkLogin.addEventListener('click', function (e) {
            e.preventDefault();
            showLogin();
        });

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const error = document.getElementById('login-error');

            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');
            error.style.display = 'none';

            if (!email || !password) {
                emailInput.classList.add('error');
                passwordInput.classList.add('error');
                error.style.display = 'block';
                return;
            }

            console.log('Login attempt:', { email, password });
        });

        registerForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const confirm = document.getElementById('register-confirm').value.trim();
            const error = document.getElementById('register-error');

            registerForm.querySelectorAll('input.error').forEach(i => i.classList.remove('error'));
            error.style.display = 'none';

            if (!name || !email || !password || !confirm) {
                registerForm.querySelectorAll('input').forEach(i => {
                    if (!i.value.trim()) i.classList.add('error');
                });
                error.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                document.getElementById('register-password').classList.add('error');
                document.getElementById('register-confirm').classList.add('error');
                error.textContent = 'Passwords do not match.';
                error.style.display = 'block';
                return;
            }

            console.log('Register attempt:', { name, email, password });
        });
    </script>
</body>
</html>
